[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcloud-fuse"
dynamic = ["version"]
description = "把中国移动云盘（个人云 / AI 沙箱）挂载为 Linux 本地目录的 FUSE 中间层"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HinaKawasaki", email = "laiyiduo@qq.com" }]
keywords = ["fuse", "pyfuse3", "cloud-disk", "mcloud", "posix", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "pyfuse3>=3.4",
    "trio>=0.25",
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-trio>=0.8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10,<2",
    "types-requests>=2.31",
]

[project.scripts]
mcloud-fuse = "mcloud_fuse.main:cli"

[project.urls]
Homepage = "https://github.com/HinaKawasaki/fuse_mcloud"
Repository = "https://github.com/HinaKawasaki/fuse_mcloud"
Issues = "https://github.com/HinaKawasaki/fuse_mcloud/issues"
Changelog = "https://github.com/HinaKawasaki/fuse_mcloud/blob/main/docs/release-notes.md"

[tool.setuptools.dynamic]
version = { attr = "mcloud_fuse.version.__version__" }

[tool.setuptools.packages.find]
include = ["mcloud_fuse*"]

[tool.mypy]
python_version = "3.10"
files = ["mcloud_fuse"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
# E501 由 formatter/评审把关；SIM105 在这里是「尽力清理」的惯用写法，
# 改成 contextlib.suppress 反而让出错路径更难读。
ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# 测试与部分脚本需要先把仓库根注入 sys.path 再 import
"tests/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["mcloud_fuse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# 离线单测约 71%（分支+语句），CI 的真实挂载用例会再高几个点；
# 门槛定在 70，避免覆盖率悄悄回退。
fail_under = 70
