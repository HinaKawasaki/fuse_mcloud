[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcloud-fuse"
dynamic = ["version"]
description = "把中国移动云盘（个人云 / AI 沙箱）挂载为 Linux 本地目录的 FUSE 中间层"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HinaKawasaki", email = "laiyiduo@qq.com" }]
keywords = ["fuse", "pyfuse3", "cloud-disk", "mcloud", "posix", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "pyfuse3>=3.4",
    "trio>=0.25",
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-trio>=0.8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
mcloud-fuse = "mcloud_fuse.main:cli"

[project.urls]
Homepage = "https://github.com/HinaKawasaki/fuse_mcloud"
Repository = "https://github.com/HinaKawasaki/fuse_mcloud"
Issues = "https://github.com/HinaKawasaki/fuse_mcloud/issues"
Changelog = "https://github.com/HinaKawasaki/fuse_mcloud/blob/main/docs/release-notes.md"

[tool.setuptools.dynamic]
version = { attr = "mcloud_fuse.version.__version__" }

[tool.setuptools.packages.find]
include = ["mcloud_fuse*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 官方 Skill 是一组顶层模块，必须先注入 sys.path 再 import；测试同样要先注入路径
"mcloud_fuse/client/*.py" = ["E402"]
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["mcloud_fuse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# 基线（合并单测 + 真实挂载用例）：71%。门槛留 2 个百分点余量；
# 新增可测代码时应同步上调，避免覆盖率悄悄回退。
fail_under = 69
