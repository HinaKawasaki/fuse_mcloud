name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff
      - name: 静态检查
        run: ruff check mcloud_fuse tests scripts

  unit:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装 libfuse3（pyfuse3 编译与导入都需要）
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev
      - name: 拉取官方云盘 Skill（basement/ 不入库，版本必须锁 1.x）
        env:
          MCLOUD_SKILL_VERSION: "1.0.4"
        run: python3 scripts/setup_basement.py
      - name: 安装本包与开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: 离线单元 / 回归测试
        run: python -m pytest tests -q
      - name: 命令入口冒烟
        run: mcloud-fuse --version

  coverage:
    # 覆盖率把「离线单测」和「真实内核挂载的假云盘用例」合在一起统计：
    # 只跑单测会低估 fuse_ops（大量回调只有真挂载才走到）。
    # 这里也顺带当 FUSE 冒烟：需要可用的 /dev/fuse 与 setuid 的 fusermount3，
    # GitHub 托管 runner 满足；自建 runner 不可用时请调整本 job。
    name: 覆盖率 + 真实挂载冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev
      - name: 拉取官方云盘 Skill（basement/ 不入库，版本必须锁 1.x）
        env:
          MCLOUD_SKILL_VERSION: "1.0.4"
        run: python3 scripts/setup_basement.py
      - name: 安装本包与开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: 离线单测
        run: coverage run --source=mcloud_fuse -m pytest tests -q
      - name: 真实挂载：只读 / 写回 / 删除全链路
        run: coverage run --append --source=mcloud_fuse tests/integration/fuse_mount_smoke.py
      - name: 真实挂载：大目录一致性与批量读写删
        run: coverage run --append --source=mcloud_fuse tests/integration/posix_stress.py
      - name: 真实挂载：小缓存强制淘汰（回归 LRU 淘汰 vs 在途读竞态）
        env:
          MCLOUD_STRESS_CACHE_MB: "1"
          MCLOUD_STRESS_FILE_BYTES: "16384"
        run: coverage run --append --source=mcloud_fuse tests/integration/posix_stress.py
      - name: 真实挂载：大文件按需（Range）读取
        env:
          MCLOUD_STRESS_EAGER_LIMIT: "1024"
          MCLOUD_STRESS_FILE_BYTES: "16384"
        run: coverage run --append --source=mcloud_fuse tests/integration/posix_stress.py
      - name: 覆盖率报告（门槛见 pyproject 的 fail_under）
        run: coverage report --skip-covered
