name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff
      - name: 静态检查
        run: ruff check mcloud_fuse tests

  unit:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装 libfuse3（pyfuse3 编译与导入都需要）
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev
      - name: 安装本包与开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: 离线单元 / 回归测试
        run: python -m pytest tests -q
      - name: 覆盖率（仅 3.12 出报告）
        if: matrix.python-version == '3.12'
        run: python -m pytest tests -q --cov=mcloud_fuse --cov-report=term-missing
      - name: 命令入口冒烟
        run: mcloud-fuse --version

  fuse-smoke:
    name: 真实内核挂载冒烟（假云盘）
    runs-on: ubuntu-latest
    # 需要一个可用的 /dev/fuse 与 setuid 的 fusermount3；GitHub 托管 runner 满足。
    # 若在自建 runner 上不可用，可把本 job 删掉或改成 continue-on-error。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev
      - name: 安装本包与开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: 只读 / 写回 / 删除全链路
        run: python tests/integration/fuse_mount_smoke.py
      - name: 大目录一致性与批量读写删
        run: python tests/integration/posix_stress.py
