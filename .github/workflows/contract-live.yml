name: Contract (live)

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）检查上游字段是否漂移
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  live:
    name: 真机端点契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装最小依赖（不需要 pyfuse3）
        run: python -m pip install --upgrade pip requests
      - name: 检查真实接口
        env:
          MCLOUD_WEB_TOKEN: ${{ secrets.MCLOUD_WEB_TOKEN }}
        run: python scripts/check_contracts.py --live --write
