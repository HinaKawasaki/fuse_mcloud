name: Contract (live)

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）检查上游字段是否漂移
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  live:
    name: 真机端点契约
    runs-on: ubuntu-latest
    env:
      # 未配置 secret 时该值为空，用它决定跑真机还是只跑离线；
      # 这样 fork / 新仓库的定时任务不会每周固定变红。
      MCLOUD_WEB_TOKEN: ${{ secrets.MCLOUD_WEB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装最小依赖（不需要 pyfuse3）
        run: python -m pip install --upgrade pip requests
      - name: 离线契约（未配置 token 时）
        if: env.MCLOUD_WEB_TOKEN == ''
        run: |
          echo "::warning title=真机契约未启用::未配置 MCLOUD_WEB_TOKEN secret，本次只校验离线 fixtures；配置方法见 docs/contracts.md"
          python scripts/check_contracts.py
      - name: 检查真实接口
        if: env.MCLOUD_WEB_TOKEN != ''
        run: python scripts/check_contracts.py --live --write
